<dialog id="delete-modal-{{ education.id }}" class="delete-modal">
    <div class="delete-modal-content">
        <h2>Hapus Education?</h2>

        <p>
            Apakah kamu yakin ingin menghapus
            <strong>{{ education.institution }}</strong>?
        </p>

        <form
            method="POST"
            action="{% url 'main:delete_education' education.id %}"
        >
            {% csrf_token %}

            <button type="submit" class="button button-danger">
                Ya, Hapus
            </button>

            <button
                type="button"
                class="button button-secondary"
                onclick="document.getElementById('delete-modal-{{ education.id }}').close()"
            >
                Batal
            </button>
        </form>
    </div>
</dialog>
